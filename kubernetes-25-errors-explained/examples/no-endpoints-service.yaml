# Error 17: Service has no endpoints
# The Service selector (app: wrong-label) does not match the pods (app: web).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
spec:
  selector:
    app: wrong-label
  ports:
  - port: 80
    targetPort: 80
