# Error 01: CrashLoopBackOff
# The container exits with code 1 immediately, so Kubernetes keeps restarting it.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo 'starting...'; sleep 2; echo 'fatal error'; exit 1"]
