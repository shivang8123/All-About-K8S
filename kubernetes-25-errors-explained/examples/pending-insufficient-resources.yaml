# Errors 11 + 12: Pending (0/N nodes available) / Insufficient cpu/memory
# Requests far above what any node can offer.
apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: "1000", memory: "1000Gi"}
