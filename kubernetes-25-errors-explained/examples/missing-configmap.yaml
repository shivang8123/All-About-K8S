# Error 09: CreateContainerConfigError
# The referenced ConfigMap does not exist.
apiVersion: v1
kind: Pod
metadata:
  name: missing-config-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    envFrom:
    - configMapRef:
        name: this-configmap-does-not-exist
