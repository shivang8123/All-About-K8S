<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="2130" font-family="Inter, DejaVu Sans, sans-serif"><rect width="1760" height="2130" fill="#fff"/><rect width="1760" height="14" fill="#0b6e99"/><text x="880.0" y="110" text-anchor="middle" font-size="68" font-weight="800" fill="#0f172a">25 Kubernetes Errors</text><rect x="410.0" y="132" width="940" height="84" rx="16" fill="#0b6e99"/><text x="880.0" y="190" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">Every Kubernetes Engineer Must Know</text><text x="880.0" y="262" text-anchor="middle" font-size="30" font-weight="600" fill="#334155">What they actually mean + how to fix them, in plain English</text><text x="350" y="302" font-size="17" font-weight="800" fill="#64748b" letter-spacing="2">ERROR</text><text x="760" y="302" font-size="17" font-weight="800" fill="#64748b" letter-spacing="2">WHAT IT MEANS</text><text x="1290" y="302" font-size="17" font-weight="800" fill="#64748b" letter-spacing="2">QUICK FIX</text><rect x="40" y="330" width="1680" height="304" rx="22" fill="#fdeaea"/><rect x="40" y="330" width="12" height="304" rx="6" fill="#ef4444"/><rect x="72" y="458.0" width="200" height="48" rx="24" fill="#ef4444"/><text x="172" y="489.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">POD CRASHES</text><text x="172" y="540.0" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">01 - 05</text><circle cx="322" cy="378.0" r="17" fill="#ef4444"/><text x="322" y="384.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">01</text><text x="350" y="385.0" font-size="19" font-weight="800" fill="#0f172a">CrashLoopBackOff</text><text x="760" y="384.0" font-size="17" font-weight="500" fill="#1e293b">App keeps crashing. K8s keeps retrying, slower each time.</text><text x="1290" y="384.0" font-size="16" font-weight="800" fill="#ef4444">kubectl logs &lt;pod&gt; --previous</text><circle cx="322" cy="430.0" r="17" fill="#ef4444"/><text x="322" y="436.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">02</text><text x="350" y="437.0" font-size="19" font-weight="800" fill="#0f172a">OOMKilled (137)</text><text x="760" y="436.0" font-size="17" font-weight="500" fill="#1e293b">Used more memory than its limit. Killed.</text><text x="1290" y="436.0" font-size="16" font-weight="800" fill="#ef4444">Raise memory limit / fix leak</text><circle cx="322" cy="482.0" r="17" fill="#ef4444"/><text x="322" y="488.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">03</text><text x="350" y="489.0" font-size="19" font-weight="800" fill="#0f172a">Init:Error</text><text x="760" y="488.0" font-size="17" font-weight="500" fill="#1e293b">A setup container failed, so your app never starts.</text><text x="1290" y="488.0" font-size="16" font-weight="800" fill="#ef4444">Check init container logs</text><circle cx="322" cy="534.0" r="17" fill="#ef4444"/><text x="322" y="540.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">04</text><text x="350" y="541.0" font-size="19" font-weight="800" fill="#0f172a">RunContainerError</text><text x="760" y="540.0" font-size="17" font-weight="500" fill="#1e293b">Container couldn't start. Bad command or mount.</text><text x="1290" y="540.0" font-size="16" font-weight="800" fill="#ef4444">Verify command, args &amp; mounts</text><circle cx="322" cy="586.0" r="17" fill="#ef4444"/><text x="322" y="592.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">05</text><text x="350" y="593.0" font-size="19" font-weight="800" fill="#0f172a">Liveness probe failed</text><text x="760" y="592.0" font-size="17" font-weight="500" fill="#1e293b">Health check failed, so it got restarted.</text><text x="1290" y="592.0" font-size="16" font-weight="800" fill="#ef4444">Tune probe path, port, timeout</text><rect x="40" y="660" width="1680" height="304" rx="22" fill="#fef2dc"/><rect x="40" y="660" width="12" height="304" rx="6" fill="#f59e0b"/><rect x="72" y="788.0" width="200" height="48" rx="24" fill="#f59e0b"/><text x="172" y="819.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">IMAGE &amp; CONFIG</text><text x="172" y="870.0" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">06 - 10</text><circle cx="322" cy="708.0" r="17" fill="#f59e0b"/><text x="322" y="714.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">06</text><text x="350" y="715.0" font-size="19" font-weight="800" fill="#0f172a">ErrImagePull</text><text x="760" y="714.0" font-size="17" font-weight="500" fill="#1e293b">Couldn't download the image. Wrong tag or no access.</text><text x="1290" y="714.0" font-size="16" font-weight="800" fill="#b45309">Verify image tag &amp; registry</text><circle cx="322" cy="760.0" r="17" fill="#f59e0b"/><text x="322" y="766.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">07</text><text x="350" y="767.0" font-size="19" font-weight="800" fill="#0f172a">ImagePullBackOff</text><text x="760" y="766.0" font-size="17" font-weight="500" fill="#1e293b">Still can't download it. Retrying slower.</text><text x="1290" y="766.0" font-size="16" font-weight="800" fill="#b45309">Check imagePullSecrets</text><circle cx="322" cy="812.0" r="17" fill="#f59e0b"/><text x="322" y="818.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">08</text><text x="350" y="819.0" font-size="19" font-weight="800" fill="#0f172a">InvalidImageName</text><text x="760" y="818.0" font-size="17" font-weight="500" fill="#1e293b">The image name itself is malformed.</text><text x="1290" y="818.0" font-size="16" font-weight="800" fill="#b45309">Fix the image name format</text><circle cx="322" cy="864.0" r="17" fill="#f59e0b"/><text x="322" y="870.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">09</text><text x="350" y="871.0" font-size="19" font-weight="800" fill="#0f172a">CreateContainerConfigError</text><text x="760" y="870.0" font-size="17" font-weight="500" fill="#1e293b">A ConfigMap or Secret it needs is missing.</text><text x="1290" y="870.0" font-size="16" font-weight="800" fill="#b45309">Create the missing ConfigMap/Secret</text><circle cx="322" cy="916.0" r="17" fill="#f59e0b"/><text x="322" y="922.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">10</text><text x="350" y="923.0" font-size="19" font-weight="800" fill="#0f172a">CreateContainerError</text><text x="760" y="922.0" font-size="17" font-weight="500" fill="#1e293b">The runtime failed to build the container.</text><text x="1290" y="922.0" font-size="16" font-weight="800" fill="#b45309">kubectl describe pod &gt; Events</text><rect x="40" y="990" width="1680" height="304" rx="22" fill="#e0eff5"/><rect x="40" y="990" width="12" height="304" rx="6" fill="#0f5b78"/><rect x="72" y="1118.0" width="200" height="48" rx="24" fill="#0f5b78"/><text x="172" y="1149.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">SCHEDULING</text><text x="172" y="1200.0" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">11 - 15</text><circle cx="322" cy="1038.0" r="17" fill="#0f5b78"/><text x="322" y="1044.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">11</text><text x="350" y="1045.0" font-size="19" font-weight="800" fill="#0f172a">Pending (0/N nodes available)</text><text x="760" y="1044.0" font-size="17" font-weight="500" fill="#1e293b">No node can fit this pod.</text><text x="1290" y="1044.0" font-size="16" font-weight="800" fill="#0f5b78">Add nodes or lower requests</text><circle cx="322" cy="1090.0" r="17" fill="#0f5b78"/><text x="322" y="1096.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">12</text><text x="350" y="1097.0" font-size="19" font-weight="800" fill="#0f172a">Insufficient cpu/memory</text><text x="760" y="1096.0" font-size="17" font-weight="500" fill="#1e293b">Your requests exceed the free capacity.</text><text x="1290" y="1096.0" font-size="16" font-weight="800" fill="#0f5b78">Right-size requests, scale cluster</text><circle cx="322" cy="1142.0" r="17" fill="#0f5b78"/><text x="322" y="1148.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">13</text><text x="350" y="1149.0" font-size="19" font-weight="800" fill="#0f172a">Untolerated taint</text><text x="760" y="1148.0" font-size="17" font-weight="500" fill="#1e293b">The node says "keep out". Your pod has no pass.</text><text x="1290" y="1148.0" font-size="16" font-weight="800" fill="#0f5b78">Add a toleration or untaint</text><circle cx="322" cy="1194.0" r="17" fill="#0f5b78"/><text x="322" y="1200.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">14</text><text x="350" y="1201.0" font-size="19" font-weight="800" fill="#0f172a">Node affinity mismatch</text><text x="760" y="1200.0" font-size="17" font-weight="500" fill="#1e293b">The pod wants labels no node has.</text><text x="1290" y="1200.0" font-size="16" font-weight="800" fill="#0f5b78">Fix nodeSelector / label nodes</text><circle cx="322" cy="1246.0" r="17" fill="#0f5b78"/><text x="322" y="1252.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">15</text><text x="350" y="1253.0" font-size="19" font-weight="800" fill="#0f172a">Evicted</text><text x="760" y="1252.0" font-size="17" font-weight="500" fill="#1e293b">The node ran low on resources and kicked it out.</text><text x="1290" y="1252.0" font-size="16" font-weight="800" fill="#0f5b78">Set requests, free node resources</text><rect x="40" y="1320" width="1680" height="304" rx="22" fill="#e0f2fd"/><rect x="40" y="1320" width="12" height="304" rx="6" fill="#0ea5e9"/><rect x="72" y="1448.0" width="200" height="48" rx="24" fill="#0ea5e9"/><text x="172" y="1479.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">NETWORKING</text><text x="172" y="1530.0" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">16 - 20</text><circle cx="322" cy="1368.0" r="17" fill="#0ea5e9"/><text x="322" y="1374.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">16</text><text x="350" y="1375.0" font-size="19" font-weight="800" fill="#0f172a">Readiness probe failed</text><text x="760" y="1374.0" font-size="17" font-weight="500" fill="#1e293b">Alive, but not ready. Gets no traffic.</text><text x="1290" y="1374.0" font-size="16" font-weight="800" fill="#0369a1">Check readiness path &amp; port</text><circle cx="322" cy="1420.0" r="17" fill="#0ea5e9"/><text x="322" y="1426.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">17</text><text x="350" y="1427.0" font-size="19" font-weight="800" fill="#0f172a">Service has no endpoints</text><text x="760" y="1426.0" font-size="17" font-weight="500" fill="#1e293b">The selector doesn't match any pod labels.</text><text x="1290" y="1426.0" font-size="16" font-weight="800" fill="#0369a1">Match selector to pod labels</text><circle cx="322" cy="1472.0" r="17" fill="#0ea5e9"/><text x="322" y="1478.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">18</text><text x="350" y="1479.0" font-size="19" font-weight="800" fill="#0f172a">Connection refused</text><text x="760" y="1478.0" font-size="17" font-weight="500" fill="#1e293b">Nothing is listening on that port.</text><text x="1290" y="1478.0" font-size="16" font-weight="800" fill="#0369a1">Check containerPort / targetPort</text><circle cx="322" cy="1524.0" r="17" fill="#0ea5e9"/><text x="322" y="1530.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">19</text><text x="350" y="1531.0" font-size="19" font-weight="800" fill="#0f172a">no such host (DNS)</text><text x="760" y="1530.0" font-size="17" font-weight="500" fill="#1e293b">Can't resolve the service name. Check CoreDNS.</text><text x="1290" y="1530.0" font-size="16" font-weight="800" fill="#0369a1">Inspect CoreDNS in kube-system</text><circle cx="322" cy="1576.0" r="17" fill="#0ea5e9"/><text x="322" y="1582.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">20</text><text x="350" y="1583.0" font-size="19" font-weight="800" fill="#0f172a">502 / 503 from Ingress</text><text x="760" y="1582.0" font-size="17" font-weight="500" fill="#1e293b">The ingress found no healthy backend.</text><text x="1290" y="1582.0" font-size="16" font-weight="800" fill="#0369a1">Check backend pods &amp; Service</text><rect x="40" y="1650" width="1680" height="304" rx="22" fill="#ece4fc"/><rect x="40" y="1650" width="12" height="304" rx="6" fill="#7c3aed"/><rect x="72" y="1778.0" width="200" height="48" rx="24" fill="#7c3aed"/><text x="172" y="1809.0" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="1">STORAGE &amp; ACCESS</text><text x="172" y="1860.0" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">21 - 25</text><circle cx="322" cy="1698.0" r="17" fill="#7c3aed"/><text x="322" y="1704.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">21</text><text x="350" y="1705.0" font-size="19" font-weight="800" fill="#0f172a">PVC Pending</text><text x="760" y="1704.0" font-size="17" font-weight="500" fill="#1e293b">No volume or StorageClass can satisfy the claim.</text><text x="1290" y="1704.0" font-size="16" font-weight="800" fill="#7c3aed">Create StorageClass / PV</text><circle cx="322" cy="1750.0" r="17" fill="#7c3aed"/><text x="322" y="1756.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">22</text><text x="350" y="1757.0" font-size="19" font-weight="800" fill="#0f172a">FailedMount / FailedAttachVolume</text><text x="760" y="1756.0" font-size="17" font-weight="500" fill="#1e293b">The volume is stuck or attached elsewhere.</text><text x="1290" y="1756.0" font-size="16" font-weight="800" fill="#7c3aed">Check node &amp; detach old attachment</text><circle cx="322" cy="1802.0" r="17" fill="#7c3aed"/><text x="322" y="1808.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">23</text><text x="350" y="1809.0" font-size="19" font-weight="800" fill="#0f172a">Forbidden (RBAC)</text><text x="760" y="1808.0" font-size="17" font-weight="500" fill="#1e293b">The service account lacks permission.</text><text x="1290" y="1808.0" font-size="16" font-weight="800" fill="#7c3aed">Add Role + RoleBinding</text><circle cx="322" cy="1854.0" r="17" fill="#7c3aed"/><text x="322" y="1860.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">24</text><text x="350" y="1861.0" font-size="19" font-weight="800" fill="#0f172a">Unauthorized (401)</text><text x="760" y="1860.0" font-size="17" font-weight="500" fill="#1e293b">The token or kubeconfig is invalid or expired.</text><text x="1290" y="1860.0" font-size="16" font-weight="800" fill="#7c3aed">Refresh kubeconfig / token</text><circle cx="322" cy="1906.0" r="17" fill="#7c3aed"/><text x="322" y="1912.0" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">25</text><text x="350" y="1913.0" font-size="19" font-weight="800" fill="#0f172a">Stuck in Terminating</text><text x="760" y="1912.0" font-size="17" font-weight="500" fill="#1e293b">A finalizer is waiting on something that never ends.</text><text x="1290" y="1912.0" font-size="16" font-weight="800" fill="#7c3aed">Fix the blocker, then remove finalizer</text><rect x="40" y="1986" width="1680" height="90" rx="22" fill="#0f172a"/><text x="880.0" y="2042" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Save this for your next on-call shift  |  Repost to help your team</text></svg>